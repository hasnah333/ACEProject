version: '3.8'

services:
  preprocessing:
    build:
      context: .
      dockerfile: services/preprocessing/Dockerfile.local
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
      - ./shared:/app/shared
      - ./services/preprocessing:/app/services/preprocessing
    environment:
      - DATA_PATH=/app/data
      - ARTIFACTS_PATH=/app/artifacts
      - REPORTS_PATH=/app/reports
    networks:
      - ml-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  mlservice:
    build:
      context: .
      dockerfile: services/mlservice/Dockerfile.local
    ports:
      - "8002:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
      - ./shared:/app/shared
      - ./services/mlservice:/app/services/mlservice
    environment:
      - DATA_PATH=/app/data
      - ARTIFACTS_PATH=/app/artifacts
      - REPORTS_PATH=/app/reports
    depends_on:
      - preprocessing
    networks:
      - ml-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  ml-network:
    driver: bridge
